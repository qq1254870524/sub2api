name: Publish GHCR Public

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push public image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/qq1254870524/sub2api:latest
            ghcr.io/qq1254870524/sub2api:stable-2026-07-29-upstream-166-full-pool
            ghcr.io/qq1254870524/sub2api:0.1.169-upstream-166-full-pool
            ghcr.io/qq1254870524/sub2api:upstream-v0.1.166-full-pool
          labels: |
            org.opencontainers.image.source=https://github.com/qq1254870524/sub2api
            org.opencontainers.image.version=0.1.169-upstream-166-full-pool
            org.opencontainers.image.description=Fork upstream v0.1.166 + CPA/A2G/peer G2A + full-pool failover
          cache-from: type=gha
          cache-to: type=gha,mode=max
